<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机样机生成器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Microsoft YaHei,sans-serif}
        body{background:#f5f7fa;display:flex;height:100vh;overflow:hidden}
        .sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
        .tab-bar{display:flex;gap:8px;padding:12px;border-bottom:1px solid #e5e7eb;overflow-x:auto}
        .tab{padding:8px 14px;border:none;border-radius:8px;background:#f3f4f6;color:#4b5563;cursor:pointer;font-size:14px}
        .tab.active{background:#0071e3;color:#fff}
        .template-list{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .template-item{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent}
        .template-item.active{border-color:#0071e3}
        .template-item img{width:100%;height:100%;object-fit:cover;display:block}
        .preview-area{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#f5f7fa}
        #canvas{border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.1);max-width:95%;max-height:95%;background:#fff}
        .panel{width:320px;background:#fff;border-left:1px solid #e5e7eb;padding:24px;display:flex;flex-direction:column;gap:16px}
        .btn{padding:12px 16px;border:none;border-radius:10px;font-size:15px;cursor:pointer}
        .btn-primary{background:#0071e3;color:#fff}
        .btn-success{background:#34c759;color:#fff}
        .btn-warning{background:#ff9500;color:#fff}
        .btn-gray{background:#8e8e93;color:#fff}
        .section{display:flex;flex-direction:column;gap:8px}
        .section label{font-size:14px;color:#333}
        input[type="color"]{width:100%;height:40px;border-radius:8px;border:1px solid #ddd}
    </style>
</head>
<body>

<div class="sidebar">
    <div class="tab-bar">
        <button class="tab active" data-target="phone">手机模板</button>
        <button class="tab" data-target="pad">平板</button>
        <button class="tab" data-target="pc">电脑</button>
        <button class="tab" data-target="group">组合</button>
    </div>
    <div class="template-list" id="templateList"></div>
</div>

<div class="preview-area">
    <canvas id="canvas"></canvas>
</div>

<div class="panel">
    <h3 style="margin-bottom:8px">手机样机生成器</h3>

    <div class="section">
        <label>上传壁纸</label>
        <button class="btn btn-primary" id="uploadBg">选择壁纸图片</button>
        <input type="file" id="bgInput" accept="image/*" style="display:none">
    </div>

    <div class="section">
        <label>上传自定义手机模板</label>
        <button class="btn btn-gray" id="uploadTemplate">上传模板</button>
        <input type="file" id="tplInput" accept="image/*" style="display:none">
    </div>

    <div class="section">
        <label>背景颜色</label>
        <input type="color" id="bgColor" value="#f5f7fa">
    </div>

    <button class="btn btn-success" id="save4k">下载 3000×4000 竖版</button>
    <button class="btn btn-warning" id="saveSquare">下载 3000×3000 方版</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const templateList = document.getElementById('templateList');
const tabs = document.querySelectorAll('.tab');

let bgImage = null;
let templates = JSON.parse(localStorage.getItem('mockupTemplates')) || [];
let selectedId = localStorage.getItem('selectedMockupId') || null;

function saveTemplates(){localStorage.setItem('mockupTemplates',JSON.stringify(templates))}
function selectId(id){selectedId=id;localStorage.setItem('selectedMockupId',id)}

function render(tab){
    templateList.innerHTML='';
    const list=templates.filter(t=>t.tab===tab);
    list.forEach(t=>{
        const el=document.createElement('div');
        el.className='template-item'+(t.id===selectedId?' active':'');
        el.innerHTML=`<img src="${t.url}">`;
        el.onclick=()=>{selectId(t.id);render(tab);draw(4000)};
        templateList.appendChild(el);
    });
    if(list.length&&!selectedId){selectId(list[0].id);draw(4000)}
}

tabs.forEach(t=>{
    t.onclick=()=>{
        tabs.forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        render(t.dataset.target);
    }
})

document.getElementById('uploadBg').onclick=()=>document.getElementById('bgInput').click();
document.getElementById('bgInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
        const img=new Image();
        img.onload=()=>{bgImage=img;localStorage.setItem('lastBg',img.src);draw(4000)};
        img.src=ev.target.result;
    };
    r.readAsDataURL(f);
};

document.getElementById('uploadTemplate').onclick=()=>document.getElementById('tplInput').click();
document.getElementById('tplInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
            const item={id:'t'+Date.now(),tab:'phone',url:ev.target.result,img:img};
            templates.push(item);saveTemplates();render('phone');
        };
        img.src=ev.target.result;
    };
    r.readAsDataURL(f);
};

function draw(h){
    const t=templates.find(x=>x.id===selectedId);if(!t)return;
    canvas.width=3000;canvas.height=h;
    ctx.clearRect(0,0,3000,h);
    ctx.drawImage(t.img,0,0,3000,h);
    if(!bgImage)return;

    const screen={x:300,y:250,w:2400,h:3500};
    const ir=bgImage.width/bgImage.height;
    const tr=screen.w/screen.h;
    let w,h;
    if(ir>tr){h=screen.h;w=h*ir}else{w=screen.w;h=w/ir}
    const x=screen.x+(screen.w-w)/2;
    const y=screen.y+(screen.h-h)/2;
    ctx.drawImage(bgImage,x,y,w,h);
}

document.getElementById('save4k').onclick=()=>{draw(4000);setTimeout(()=>{
    const a=document.createElement('a');a.download='手机样机_3000x4000.png';
    a.href=canvas.toDataURL('image/png');a.click();
},300)}

document.getElementById('saveSquare').onclick=()=>{draw(3000);setTimeout(()=>{
    const a=document.createElement('a');a.download='手机样机_3000x3000.png';
    a.href=canvas.toDataURL('image/png');a.click();
},300)}

window.onload=()=>{
    const last=localStorage.getItem('lastBg');
    if(last){const img=new Image();img.onload=()=>{bgImage=img;render('phone')};img.src=last}
    else render('phone');
}
</script>
</body>
</html>
