<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>手机样机生成器</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif}
    body{background:#f5f7fa;height:100vh;display:flex;overflow:hidden}
    .sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
    .tabs{display:flex;gap:8px;padding:12px;border-bottom:1px solid #e5e7eb;overflow-x:auto}
    .tab{padding:8px 14px;border-radius:8px;background:#f3f4f6;color:#4b5563;border:none;cursor:pointer;font-size:14px}
    .tab.active{background:#0071e3;color:#fff}
    .template-list{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .template-item{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid #fff}
    .template-item.active{border-color:#0071e3}
    .template-item img{width:100%;height:100%;object-fit:cover;display:block}
    .preview{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
    #canvas{max-width:90%;max-height:90%;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.1);background:#fff}
    .panel{width:320px;background:#fff;border-left:1px solid #e5e7eb;padding:24px;display:flex;flex-direction:column;gap:16px}
    .btn{padding:12px;border-radius:10px;border:none;font-size:15px;cursor:pointer}
    .btn-blue{background:#0071e3;color:#fff}
    .btn-green{background:#34c759;color:#fff}
    .btn-orange{background:#ff9500;color:#fff}
    .btn-gray{background:#8e8e93;color:#fff}
    .section{display:flex;flex-direction:column;gap:8px}
    .section label{font-size:14px;color:#111}
  </style>
</head>
<body>

<div class="sidebar">
  <div class="tabs">
    <button class="tab active" data-type="phone">手机模板</button>
    <button class="tab" data-type="pad">平板</button>
    <button class="tab" data-type="pc">电脑</button>
    <button class="tab" data-type="group">组合</button>
  </div>
  <div class="template-list" id="list"></div>
</div>

<div class="preview">
  <canvas id="canvas"></canvas>
</div>

<div class="panel">
  <h3 style="margin-bottom:8px">手机样机生成器</h3>

  <div class="section">
    <label>上传壁纸</label>
    <button class="btn btn-blue" id="uploadBg">选择壁纸图片</button>
    <input type="file" id="bgFile" accept="image/*" style="display:none">
  </div>

  <button class="btn btn-green" id="save4k">下载 3000×4000 竖版</button>
  <button class="btn btn-orange" id="saveSquare">下载 3000×3000 方版</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const listEl = document.getElementById('list');
const tabs = document.querySelectorAll('.tab');

let bgImage = null;
let selected = null;

// 官方原版内置模板（1:1还原）
const templates = [
  {
    id: "p1",
    type: "phone",
    url: "https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/60a16562fa8c449c9d0202ae854cb31c.png",
    screen: { x: 360, y: 340, w: 2280, h: 3320 }
  },
  {
    id: "p2",
    type: "phone",
    url: "https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/817932ffb92441d7a81aa02f55fca296.png",
    screen: { x: 360, y: 340, w: 2280, h: 3320 }
  },
  {
    id: "p3",
    type: "phone",
    url: "https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/62c1b12a34d946e7a8fa7bca7565c683.png",
    screen: { x: 360, y: 340, w: 2280, h: 3320 }
  }
];

// 渲染列表
function render(type) {
  listEl.innerHTML = '';
  const items = templates.filter(t => t.type === type);
  items.forEach(t => {
    const d = document.createElement('div');
    d.className = 'template-item' + (t.id === selected ? ' active' : '');
    d.innerHTML = `<img src="${t.url}">`;
    d.onclick = () => {
      selected = t.id;
      render(type);
      draw(4000);
    };
    listEl.appendChild(d);
  });
  if (items.length && !selected) selected = items[0].id;
  draw(4000);
}

// 绘制
function draw(h) {
  const t = templates.find(x => x.id === selected);
  if (!t) return;
  canvas.width = 3000;
  canvas.height = h;
  ctx.clearRect(0, 0, 3000, h);

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    ctx.drawImage(img, 0, 0, 3000, h);
    if (bgImage) {
      const s = t.screen;
      const ir = bgImage.width / bgImage.height;
      const sr = s.w / s.h;
      let w, hh;
      if (ir > sr) {
        hh = s.h;
        w = hh * ir;
      } else {
        w = s.w;
        hh = w / ir;
      }
      const x = s.x + (s.w - w) / 2;
      const y = s.y + (s.h - hh) / 2;
      ctx.drawImage(bgImage, x, y, w, hh);
    }
  };
  img.src = t.url;
}

// 上传壁纸
document.getElementById('uploadBg').onclick = () => {
  document.getElementById('bgFile').click();
};
document.getElementById('bgFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      draw(4000);
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
};

// 下载
document.getElementById('save4k').onclick = () => {
  draw(4000);
  setTimeout(() => {
    const a = document.createElement('a');
    a.download = 'mockup_3000x4000.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }, 300);
};
document.getElementById('saveSquare').onclick = () => {
  draw(3000);
  setTimeout(() => {
    const a = document.createElement('a');
    a.download = 'mockup_3000x3000.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }, 300);
};

// 标签
tabs.forEach(tab => {
  tab.onclick = () => {
    tabs.forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.type);
  };
});

// 启动
render('phone');
</script>
</body>
</html>
