<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高清样机生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { background: #f5f7fa; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; }
        .tab-nav { display: flex; border-bottom: 1px solid #eee; padding: 10px; gap: 8px; overflow-x: auto; }
        .tab-btn { padding: 8px 16px; border: none; background: #f5f5f5; font-size: 15px; cursor: pointer; color: #666; border-radius: 6px; }
        .tab-btn.active { color: #fff; background: #009688; font-weight: bold; }
        
        .template-list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .template-item { border-radius: 8px; overflow: hidden; border: 2px solid #fff; cursor: pointer; position: relative; aspect-ratio: 3 / 4; }
        .template-item.active { border-color: #009688; }
        .template-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .preview-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #f5f7fa; }
        #previewCanvas { border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); max-width: 95%; max-height: 95%; background: transparent; }

        .control-panel { width: 320px; background: #fff; border-left: 1px solid #eee; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary { background: #009688; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-gray { background: #6c757d; color: white; }
        .color-input { width: 100%; height: 40px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="phone">手机模板</button>
        <button class="tab-btn" data-tab="pad">平板</button>
        <button class="tab-btn" data-tab="pc">电脑</button>
        <button class="tab-btn" data-tab="group">组合</button>
    </div>
    <div class="template-list" id="templateList"></div>
</div>

<div class="preview-area">
    <canvas id="previewCanvas"></canvas>
</div>

<div class="control-panel">
    <h3>壁纸样机生成器</h3>
    <button class="btn btn-primary" id="uploadBtn">上传壁纸图片</button>
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">

    <button class="btn btn-gray" id="uploadCustomTemplateBtn">上传自定义手机模板</button>
    <input type="file" id="customTemplateUpload" accept="image/*" style="display: none;">

    <button class="btn btn-success" id="downloadBtn4000">下载 3000×4000 竖版</button>
    <button class="btn btn-warning" id="downloadBtn3000">下载 3000×3000 方版</button>
</div>

<script>
const uploadBtn = document.getElementById('uploadBtn');
const imageUpload = document.getElementById('imageUpload');
const previewCanvas = document.getElementById('previewCanvas');
const downloadBtn4000 = document.getElementById('downloadBtn4000');
const downloadBtn3000 = document.getElementById('downloadBtn3000');
const uploadCustomTemplateBtn = document.getElementById('uploadCustomTemplateBtn');
const customTemplateUpload = document.getElementById('customTemplateUpload');
const templateList = document.getElementById('templateList');
const tabBtns = document.querySelectorAll('.tab-btn');
const ctx = previewCanvas.getContext('2d');

let uploadedImage = null;
let selectedTemplateId = null;
let customTemplates = [];

function renderTemplates(tab) {
    templateList.innerHTML = '';
    let list = customTemplates.filter(t => t.tab === tab);
    
    list.forEach(t => {
        const div = document.createElement('div');
        div.className = 'template-item';
        if (selectedTemplateId === t.id) div.classList.add('active');
        div.innerHTML = `<img src="${t.thumb}">`;
        div.onclick = () => {
            document.querySelectorAll('.template-item').forEach(i=>i.classList.remove('active'));
            div.classList.add('active');
            selectedTemplateId = t.id;
            draw(4000);
        };
        templateList.appendChild(div);
    });
    if (list.length > 0 && !selectedTemplateId) {
        selectedTemplateId = list[0].id;
        draw(4000);
    }
}

tabBtns.forEach(btn => {
    btn.onclick = () => {
        tabBtns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderTemplates(btn.dataset.tab);
    };
});

uploadBtn.onclick = () => imageUpload.click();
imageUpload.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        const img = new Image();
        img.onload = () => { uploadedImage = img; draw(4000); };
        img.src = ev.target.result;
    };
    r.readAsDataURL(f);
};

uploadCustomTemplateBtn.onclick = () => customTemplateUpload.click();
customTemplateUpload.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        const img = new Image();
        img.onload = () => {
            const item = {
                id: 'tpl_' + Date.now(),
                tab: 'phone',
                thumb: ev.target.result,
                img: img
            };
            customTemplates.push(item);
            renderTemplates('phone');
        };
        img.src = ev.target.result;
    };
    r.readAsDataURL(f);
};

function draw(h) {
    const tpl = customTemplates.find(t => t.id === selectedTemplateId);
    if (!tpl) return;

    previewCanvas.width = 3000;
    previewCanvas.height = h;

    ctx.clearRect(0,0,3000,h);
    ctx.drawImage(tpl.img, 0,0,3000,h);

    if (uploadedImage) {
        ctx.drawImage(uploadedImage, 300, 250, 2400, 3500);
    }
}

downloadBtn4000.onclick = () => { draw(4000); setTimeout(()=>{
    let a = document.createElement('a');
    a.download = '样机_3000x4000.png';
    a.href = previewCanvas.toDataURL('image/png');
    a.click();
},200); };

downloadBtn3000.onclick = () => { draw(3000); setTimeout(()=>{
    let a = document.createElement('a');
    a.download = '样机_3000x3000.png';
    a.href = previewCanvas.toDataURL('image/png');
    a.click();
},200); };

renderTemplates('phone');
</script>
</body>
</html>
