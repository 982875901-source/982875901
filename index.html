<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>手机样机生成器</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
    body{background:#f5f7fa;height:100vh;display:flex;overflow:hidden}
    .sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
    .tabs{display:flex;gap:8px;padding:12px;border-bottom:1px solid #e5e7eb}
    .tab{padding:8px 14px;border-radius:8px;background:#f3f4f6;color:#4b5563;border:none;cursor:pointer}
    .tab.active{background:#0071e3;color:#fff}
    .template-list{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .template-item{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid #fff;aspect-ratio:3/4}
    .template-item.active{border-color:#0071e3}
    .template-item img{width:100%;height:100%;object-fit:cover}
    .preview{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
    #canvas{max-width:90%;max-height:90%;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
    .panel{width:320px;background:#fff;border-left:1px solid #e5e7eb;padding:24px;display:flex;flex-direction:column;gap:16px}
    .btn{padding:12px;border-radius:10px;border:none;font-size:15px;cursor:pointer}
    .btn-blue{background:#0071e3;color:#fff}
    .btn-green{background:#34c759;color:#fff}
    .btn-orange{background:#ff9500;color:#fff}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="tabs">
    <button class="tab active">手机模板</button>
  </div>
  <div class="template-list" id="list"></div>
</div>
<div class="preview">
  <canvas id="canvas"></canvas>
</div>
<div class="panel">
  <h3>手机样机生成器</h3>
  <button class="btn btn-blue" id="uploadBg">选择壁纸图片</button>
  <input type="file" id="bgFile" accept="image/*" style="display:none">
  <button class="btn btn-green" id="save4k">下载 3000×4000 竖版</button>
  <button class="btn btn-orange" id="saveSquare">下载 3000×3000 方版</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const listEl = document.getElementById('list');
let bgImage = null, selected = null;

const templates = [
  {id:"t1",url:"https://picsum.photos/id/0/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t2",url:"https://picsum.photos/id/160/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t3",url:"https://picsum.photos/id/119/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t4",url:"https://picsum.photos/id/42/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t5",url:"https://picsum.photos/id/1068/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t6",url:"https://picsum.photos/id/325/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t7",url:"https://picsum.photos/id/164/3000/4000",screen:{x:360,y:340,w:2280,h:3320}},
  {id:"t8",url:"https://picsum.photos/id/131/3000/4000",screen:{x:360,y:340,w:2280,h:3320}}
];

function render(){
  listEl.innerHTML='';
  templates.forEach(t=>{
    const d=document.createElement('div');
    d.className='template-item'+(t.id===selected?' active':'');
    d.innerHTML=`<img src="${t.url}">`;
    d.onclick=()=>{selected=t.id;render();draw(4000);};
    listEl.appendChild(d);
  });
  if(!selected) selected=templates[0].id;
  draw(4000);
}

function draw(h){
  const t=templates.find(x=>x.id===selected);
  if(!t)return;
  canvas.width=3000;canvas.height=h;
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=()=>{
    ctx.drawImage(img,0,0,3000,h);
    if(bgImage){
      const s=t.screen;
      const ir=bgImage.width/bgImage.height;
      const sr=s.w/s.h;
      let w,hh;
      ir>sr?(hh=s.h,w=hh*ir):(w=s.w,hh=w/ir);
      ctx.drawImage(bgImage,s.x+(s.w-w)/2,s.y+(s.h-hh)/2,w,hh);
    }
  };
  img.src=t.url;
}

document.getElementById('uploadBg').onclick=()=>document.getElementById('bgFile').click();
document.getElementById('bgFile').onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{bgImage=img;draw(4000);};
    img.src=ev.target.result;
  };
  r.readAsDataURL(e.target.files[0]);
};

document.getElementById('save4k').onclick=()=>{draw(4000);setTimeout(()=>{
  const a=document.createElement('a');a.download='竖版样机.png';a.href=canvas.toDataURL('image/png');a.click();
},200);};
document.getElementById('saveSquare').onclick=()=>{draw(3000);setTimeout(()=>{
  const a=document.createElement('a');a.download='方版样机.png';a.href=canvas.toDataURL('image/png');a.click();
},200);};

render();
</script>
</body>
</html>
