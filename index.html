<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机样机生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .tab {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #4b5563;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #0071e3;
            color: #fff;
        }
        .template-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .template-item {
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
            cursor: pointer;
            aspect-ratio: 3/4;
        }
        .template-item.active {
            border-color: #0071e3;
        }
        .template-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #canvas {
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            max-height: 90%;
            background: #fff;
        }
        .control-panel {
            width: 320px;
            background: #fff;
            border-left: 1px solid #eee;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-primary { background: #0071e3; color: #fff; }
        .btn-gray { background: #8e8e93; color: #fff; }
        .btn-success { background: #34c759; color: #fff; }
        .btn-warning { background: #ff9500; color: #fff; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="tab-bar">
        <button class="tab active" data-tab="phone">手机模板</button>
        <button class="tab" data-tab="pad">平板</button>
        <button class="tab" data-tab="pc">电脑</button>
        <button class="tab" data-tab="group">组合</button>
    </div>
    <div class="template-list" id="templateList"></div>
</div>

<div class="preview-area">
    <canvas id="canvas"></canvas>
</div>

<div class="control-panel">
    <h3>手机样机生成器</h3>
    <button class="btn btn-primary" id="uploadWallpaper">上传壁纸</button>
    <input type="file" id="wallpaperInput" accept="image/*" style="display:none">

    <button class="btn btn-gray" id="uploadTemplate">上传手机模板</button>
    <input type="file" id="templateInput" accept="image/*" style="display:none">

    <button class="btn btn-success" id="download3000x4000">下载 3000×4000</button>
    <button class="btn btn-warning" id="download3000x3000">下载 3000×3000</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const templateList = document.getElementById('templateList');
const tabs = document.querySelectorAll('.tab');

let wallpaper = null;
let templates = [];   // 存储 { id, tab, url, img (预加载Image) }
let selectedId = null;
let currentTab = 'phone';

// 本地存储加载
function loadFromStorage() {
    try {
        const saved = localStorage.getItem('templates');
        if (saved) {
            const arr = JSON.parse(saved);
            // 重建并预加载图片
            templates = arr.map(item => {
                const img = new Image();
                img.src = item.url;
                return { ...item, img };
            });
        }
        selectedId = localStorage.getItem('selectedId');
        const wpHref = localStorage.getItem('lastWallpaper');
        if (wpHref) {
            wallpaper = new Image();
            wallpaper.src = wpHref;
        }
    } catch (e) { console.error('加载失败', e); }
}

// 保存到本地
function saveToStorage() {
    const saveList = templates.map(({id, tab, url}) => ({id, tab, url}));
    localStorage.setItem('templates', JSON.stringify(saveList));
    localStorage.setItem('selectedId', selectedId);
    if (wallpaper) localStorage.setItem('lastWallpaper', wallpaper.src);
}

// 渲染左侧模板列表
function render(tabName) {
    currentTab = tabName;
    templateList.innerHTML = '';
    const list = templates.filter(t => t.tab === tabName);
    list.forEach(t => {
        const div = document.createElement('div');
        div.className = 'template-item' + (t.id === selectedId ? ' active' : '');
        div.innerHTML = `<img src="${t.url}">`;
        // ✅ 点击：立即更新选中 + 同步绘制（秒切）
        div.onclick = () => {
            selectedId = t.id;
            saveToStorage();
            render(tabName);
            draw(4000); // 同步绘制，无延迟
        };
        templateList.appendChild(div);
    });
    // 自动选中第一个
    if (list.length && !selectedId) {
        selectedId = list[0].id;
        saveToStorage();
    }
    draw(4000);
}

// 切换标签
tabs.forEach(tab => {
    tab.onclick = () => {
        tabs.forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        render(tab.dataset.tab);
    };
});

// 上传壁纸
document.getElementById('uploadWallpaper').onclick = () => {
    document.getElementById('wallpaperInput').click();
};
document.getElementById('wallpaperInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        wallpaper = new Image();
        wallpaper.src = ev.target.result;
        wallpaper.onload = () => {
            saveToStorage();
            draw(4000);
        };
    };
    reader.readAsDataURL(file);
};

// 上传模板（✅ 上传即预加载img，0延迟显示）
document.getElementById('uploadTemplate').onclick = () => {
    document.getElementById('templateInput').click();
};
document.getElementById('templateInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const url = ev.target.result;
        const img = new Image();
        img.src = url;
        const item = {
            id: 't' + Date.now(),
            tab: 'phone',
            url,
            img // ✅ 缓存Image对象
        };
        templates.push(item);
        saveToStorage();
        selectedId = item.id; // 自动选中刚上传
        render('phone');
    };
    reader.readAsDataURL(file);
};

// ✅ 核心修复：同步绘制（无new Image、无onload异步）
function draw(height) {
    const tpl = templates.find(x => x.id === selectedId);
    if (!tpl || !tpl.img) return;

    canvas.width = 3000;
    canvas.height = height;
    ctx.clearRect(0, 0, 3000, height);

    // 1. 画模板（同步，已预加载）
    ctx.drawImage(tpl.img, 0, 0, 3000, height);

    // 2. 画壁纸（在手机框内）
    if (wallpaper && wallpaper.complete) {
        const phoneFrame = { x: 360, y: 340, w: 2280, h: 3320 };
        const iw = wallpaper.width;
        const ih = wallpaper.height;
        const scale = Math.max(phoneFrame.w / iw, phoneFrame.h / ih);
        const w = iw * scale;
        const h = ih * scale;
        const x = phoneFrame.x + (phoneFrame.w - w) / 2;
        const y = phoneFrame.y + (phoneFrame.h - h) / 2;
        ctx.drawImage(wallpaper, x, y, w, h);
    }
}

// 下载
document.getElementById('download3000x4000').onclick = () => {
    draw(4000);
    setTimeout(() => {
        const a = document.createElement('a');
        a.download = '手机样机_3000x4000.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }, 200);
};
document.getElementById('download3000x3000').onclick = () => {
    draw(3000);
    setTimeout(() => {
        const a = document.createElement('a');
        a.download = '手机样机_3000x3000.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }, 200);
};

// 初始化
loadFromStorage();
render('phone');
</script>
</body>
</html>
